<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件BOX</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
import { getDatabase, ref, set, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyC6hDHQhmq7VKoUKaOnDlBQFcscv__HYig",
  authDomain: "taiki-tasks-933cc.firebaseapp.com",
  databaseURL: "https://taiki-tasks-933cc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "taiki-tasks-933cc",
  storageBucket: "taiki-tasks-933cc.firebasestorage.app",
  messagingSenderId: "679381676234",
  appId: "1:679381676234:web:20b54086cd302494c0c433"
});
initializeAppCheck(app, { provider: new ReCaptchaV3Provider("6LeBcpctAAAAAFUv0nKLpia0xLoFo2JNH6d86tWt"), isTokenAutoRefreshEnabled: true });
const db = getDatabase(app);
window._fb = { db, ref, set, update, onValue, get };
// ログインはタスクCanly／ガチ楽と共通（同じブラウザならFirebaseのログイン状態を共有）
onAuthStateChanged(getAuth(app), user => window.onAuth && window.onAuth(user));
</script>
<style>
  /* デザインはタスクCanlyに合わせる（色・フォント・角丸・カード） */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#F0EFE9;--surface:#FFF;--surface2:#EFEDE6;
    --border:#E2DFD6;--border2:#C9C6BC;
    --text:#18171A;--text2:#5C5A62;--text3:#9B99A4;
    --accent:#3A5EE5;--accent-bg:#EDF0FC;
    --red:#C0253A;--red-bg:#FDEAED;
    --r8:8px;--r12:12px;--r16:16px;
    --shadow-lg:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
    --font:"Instrument Sans",sans-serif;
    --s1:#3A5EE5; --s2:#D97706; --s3:#1A7A50; --s4:#9B99A4;
  }
  html,body{height:100%}
  body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);overflow:hidden}
  button,input,select,textarea{font-family:var(--font);font-size:13px}

  /* ===== ツールバー ===== */
  #bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 20px}
  #bar .ttl{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  #bar .ttl .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  #bar .ttl .n{font-size:12px;font-weight:600;color:#fff;background:var(--c);border-radius:20px;padding:1px 9px}
  #bar .sum{font-size:12px;color:var(--text2)}
  #q{width:240px;height:34px;border:1px solid var(--border);border-radius:var(--r8);padding:0 11px;background:var(--surface);margin-left:auto}
  #q:focus{outline:none;border-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:var(--r8);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text2);white-space:nowrap;transition:all .14s}
  .btn:hover{background:var(--surface2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.1);background:var(--accent)}

  /* ===== 案件一覧（選んだステータスのみ） ===== */
  /* 左に会社名リスト、右に詳細を常に表示（メールソフト／Googleマップ型） */
  #main2{display:flex;height:calc(100% - 55px)}
  #list{width:320px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .l-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3)}
  .sortdir{height:28px;border:1px solid var(--border);border-radius:var(--r8);background:var(--surface);color:var(--text2);font-size:12px;padding:0 9px;cursor:pointer;white-space:nowrap}
  .sortdir:hover{background:var(--surface2)}
  .copy{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:6px;font-size:11px;padding:2px 9px;cursor:pointer;white-space:nowrap}
  .copy:hover{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
  .l-head select{margin-left:auto;height:28px;border:1px solid var(--border);border-radius:var(--r8);padding:0 6px;background:var(--surface);font-size:12px;color:var(--text2)}
  #board{flex:1;overflow-y:auto}
  .li{display:block;padding:10px 14px 10px 12px;border-bottom:1px solid var(--border);border-left:3px solid transparent;cursor:pointer}
  .li:hover{background:#FAF9F5}
  .li.sel{background:var(--accent-bg);border-left-color:var(--accent)}
  .li .nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .li .mt{font-size:11.5px;color:var(--text2);margin-top:3px;display:flex;gap:8px;white-space:nowrap;overflow:hidden}
  .li .mt .money{color:var(--text);font-weight:600}
  .li .mt .due{color:var(--red);font-weight:600}
  /* メール（Gmail連携）: 最終メール送信日と赤ランプ（商談中・追客中で14日以上未送信） */
  .mail{white-space:nowrap}
  .mail.old{color:var(--red);font-weight:700}
  .mail.none{color:var(--text3)}
  .lamp{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(192,37,58,.6);animation:lamp 1.6s ease-in-out infinite;vertical-align:0;margin-right:4px}
  @keyframes lamp{0%,100%{box-shadow:0 0 0 0 rgba(192,37,58,.55)}50%{box-shadow:0 0 0 5px rgba(192,37,58,0)}}
  .sf-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sf-note{font-size:11px;color:var(--text3);margin-top:6px}
  .p-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
  .card{background:var(--surface);border:1.5px solid var(--border2);border-left:4px solid var(--c);border-radius:var(--r12);padding:11px 13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .14s,transform .14s}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
  .card .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
  .card .mt{font-size:12px;color:var(--text2);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .card .mt .money{color:var(--text);font-weight:700}
  .card .na{font-size:12px;margin-top:8px;padding:6px 9px;background:var(--surface2);border-radius:var(--r8);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .na.due{color:var(--red);background:var(--red-bg)}
  .empty{color:var(--text3);font-size:13px;text-align:center;padding:40px 0}

  /* ===== 詳細パネル（右から大きく出る） ===== */
  #panel{flex:1;min-width:0;background:var(--surface);display:flex;flex-direction:column}
  .p-head{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
  .p-head h2{font-size:19px;line-height:1.35;flex:1;min-width:0;font-weight:700}
  .p-head .x{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--text3);padding:0 4px}
  .p-head .x:hover{color:var(--text)}
  .badge{display:inline-block;font-size:11px;color:#fff;background:var(--c);border-radius:20px;padding:2px 9px;font-weight:600;vertical-align:3px;margin-left:8px}
  .p-tools{display:flex;gap:8px;padding:9px 20px;border-bottom:1px solid var(--border);background:var(--surface2);align-items:center}
  .p-tools select{height:32px;border:1px solid var(--border);border-radius:var(--r8);padding:0 8px;background:var(--surface)}
  .p-body{flex:1;overflow-y:auto;padding:4px 20px 30px}
  .sec{padding:15px 0;border-bottom:1px solid var(--border)}
  .sec:last-child{border-bottom:0}
  .sec h3{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:9px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
  .add{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;font-weight:500}
  .grid{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;font-size:13px}
  .grid dt{color:var(--text3)}
  .grid dd{word-break:break-all}
  .grid a{color:var(--accent)}
  .txt{font-size:13px;line-height:1.8;white-space:pre-wrap}
  .na-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--border)}
  .na-row:last-child{border-bottom:0}
  .na-row.done .t{text-decoration:line-through;color:var(--text3)}
  .na-row .t{flex:1}
  .na-row .m{font-size:12px;color:var(--text3);white-space:nowrap}
  .meet{border:1px solid var(--border);border-radius:var(--r8);margin-bottom:8px;overflow:hidden}
  .meet-h{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;background:var(--surface2)}
  .meet-h .d{font-weight:700;font-size:13px;white-space:nowrap}
  .meet-h .ty{font-size:12px;color:var(--text2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meet-h .arr{color:var(--accent);font-size:12px;white-space:nowrap}
  .meet-s{padding:9px 12px;font-size:13px;line-height:1.7;white-space:pre-wrap;border-top:1px solid var(--border)}
  .minutes{padding:12px;font-size:12px;line-height:1.75;white-space:pre-wrap;background:#FCFBF8;border-top:1px solid var(--border);max-height:440px;overflow-y:auto}
  /* 編集フォーム */
  .f{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;align-items:center}
  .f label{font-size:12px;color:var(--text3)}
  .f input,.f select,.f textarea{width:100%;border:1px solid var(--border);border-radius:var(--r8);padding:7px 10px;background:var(--surface)}
  .f textarea{min-height:72px;resize:vertical;line-height:1.6}
  .f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--accent)}
  .f .full{grid-column:1/-1}
  .na-edit{display:grid;grid-template-columns:1fr 130px 90px 28px;gap:6px;margin-bottom:6px}
  .na-edit input{border:1px solid var(--border);border-radius:var(--r8);padding:6px 8px}
  .na-edit button{border:0;background:none;color:var(--red);cursor:pointer;font-size:17px}

  /* モーダル（新規登録） */
  #modal{position:fixed;inset:0;background:rgba(24,23,26,.35);display:none;align-items:center;justify-content:center;z-index:30}
  #modal.open{display:flex}
  .m-box{background:var(--surface);border-radius:var(--r16);width:min(720px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .m-head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex}
  .m-head .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--text3)}
  .m-body{padding:16px 20px;overflow-y:auto}
  .m-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .note{font-size:12px;color:#A05C00;background:#FEF4E3;border-radius:var(--r8);padding:8px 12px;margin-bottom:14px;line-height:1.6}

  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;background:var(--bg);z-index:40}
  /* 秘書（記憶待ち）表示 */
  .qpill{display:none;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
  .qpill.show{display:inline-flex}
  .qpill.err{background:var(--red-bg);color:var(--red)}
  .qpill .spin{width:10px;height:10px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1;height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r8);cursor:pointer;color:var(--text2);font-weight:500}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .qrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
  .qrow .st{flex-shrink:0;width:64px;font-weight:700}
  .qrow .bd{flex:1;min-width:0;line-height:1.6}
  .qrow .bd .er{color:var(--red)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:9px 18px;border-radius:var(--r8);opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
  #toast.show{opacity:1}

  @media (max-width:760px){
    /* スマホ: リストを全幅、詳細は上に重ねて表示 */
    #list{width:100%}
    #panel{position:fixed;inset:0;z-index:20;transform:translateX(105%);transition:transform .22s ease}
    #panel.open{transform:none}
    #bar{flex-wrap:wrap}
    #q{width:100%;order:3;margin-left:0}
    #main2{height:calc(100% - 100px)}
  }
</style>
</head>
<body>
<div id="msg">読み込み中...</div>

<div id="bar">
  <div class="ttl" id="ttl"></div>
  <span class="sum" id="sum"></span>
  <span class="qpill" id="qpill" onclick="openQueue()"></span>
  <input id="q" placeholder="会社名・担当者・メモで検索">
  <button class="btn primary" onclick="openNew()">＋ 案件を登録</button>
</div>
<div id="main2">
  <div id="list">
    <div class="l-head"><span id="lcount"></span>
      <select id="sort" onchange="renderBoard()" title="並び替えの項目">
        <option value="lastMeet">最終商談日</option>
        <option value="stores">店舗数</option>
        <option value="monthly">金額（月額）</option>
        <option value="name">会社名</option>
        <option value="updated">更新日</option>
        <option value="mail">最終メール送信日</option>
      </select>
      <button class="sortdir" id="sortdir" onclick="toggleDir()" title="昇順／降順を切り替え">↑ 昇順</button></div>
    <div id="board"></div>
  </div>

  <aside id="panel"><div class="p-empty">左の一覧から案件を選んでください</div></aside>
</div>

<div id="modal"><div class="m-box">
  <div class="m-head"><span id="m-title">案件を登録</span><button class="x" onclick="closeNew()">×</button></div>
  <div class="m-body" id="m-body"></div>
  <div class="m-foot" id="m-foot"><button class="btn" onclick="closeNew()">キャンセル</button><button class="btn primary" id="m-save" onclick="saveNew()">登録する</button></div>
</div></div>
<div id="toast"></div>

<script>
// ===== 案件BOX（無限会社中村の「案件登録・秘書の記憶」を引き継いだもの） =====
// データ: dealbox/deals/{id}（案件情報）, dealbox/minutes/{id}/{key}（議事録本文。開いたときだけ読む）
const STATUSES = [
  {k:'商談中', c:'var(--s1)'}, {k:'追客中', c:'var(--s2)'}, {k:'受注', c:'var(--s3)'}, {k:'失注', c:'var(--s4)'}
];
const colorOf = s => (STATUSES.find(x=>x.k===s)||STATUSES[0]).c;
let deals = {}, selId = null, editing = false, minutesCache = {}, openMeet = {};
// 表示するステータス。ガチ楽の左メニュー（案件BOX配下）から ?status= / setStatus() で切り替わる
let curStatus = new URLSearchParams(location.search).get('status') || '商談中';
window.setStatus = s => {
  if(!STATUSES.find(x=>x.k===s)) return;
  // 表示中の案件がそのステータスにあるなら選択を保つ（followDeal からの同期）
  if(selId && deals[selId] && deals[selId].status===s){ curStatus = s; renderBoard(); return; }
  curStatus = s; selId = null; editing = false; renderBoard(); if(!selId) closePanel();
};
// 案件のステータスが表示中と違うとき、一覧とガチ楽の左メニューをその案件のステータスへ移す
function followDeal(id){
  const st = deals[id] && deals[id].status;
  if(st && st!==curStatus){
    curStatus = st;
    try{ parent && parent!==window && parent.syncDealSub && parent.syncDealSub(st); }catch(e){}
  }
  selId = id; renderBoard(); openPanel(id);
}

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = v => (v===null||v===undefined||v==='') ? '' : (isNaN(Number(v)) ? String(v) : Number(v).toLocaleString('ja-JP')+'円');
const today = () => new Date().toISOString().slice(0,10);
const nowIso = () => new Date().toISOString();
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
const arr = v => Array.isArray(v) ? v : (v && typeof v==='object' ? Object.values(v) : []);
// 次回商談は文字列 or {date,time,...} の両方がある
function nextMeetText(nm){
  if(!nm) return '';
  if(typeof nm==='string') return nm;
  return [nm.date, nm.time, nm.type||nm.note||nm.memo].filter(Boolean).join(' ');
}

// ===== 認証・データ購読 =====
let me = '', queue = {}, mineSeen = {}, mailData = {}, mailStatus = {}, memberOf = {};
const MEMBER_NAME = {nakamura:'中村', naka:'中', sakurai:'櫻井', aoki:'青木'};
// ===== メール（Gmail連携）: 最終メール送信日 =====
const LAMP_DAYS = 14;
const ACTIVE = s => s==='商談中' || s==='追客中';
function mailInfo(d){
  const x = mailData[d.id] || {};
  if(!x.checkedAt) return {linked:false};
  if(!x.lastSentAt) return {linked:true, none:true};
  const date = new Date(x.lastSentAt).toLocaleDateString('sv-SE');   // YYYY-MM-DD（日本時間）
  const days = Math.floor((new Date(today()) - new Date(date)) / 86400000);
  return {linked:true, date, days, old: ACTIVE(d.status) && days >= LAMP_DAYS};
}
function mailHtml(d){
  const m = mailInfo(d);
  if(!m.linked) return '';
  if(m.none) return ACTIVE(d.status) ? '<span class="mail none">✉ 送信履歴なし</span>' : '';
  return `<span class="mail${m.old?' old':''}">${m.old?'<span class="lamp"></span>':''}✉ ${esc(m.date.slice(5).replace('-','/'))}</span>`;
}
async function requestMailSync(){
  const {db, ref, update} = window._fb;
  await update(ref(db,'dealbox/mailStatus'), {requestedAt: nowIso(), requestedBy: me});
  toast('同期を依頼しました（10分以内に反映されます）');
}
window.onAuth = user => {
  if(user) me = user.email || '';
  if(!user){ $('msg').style.display='flex'; $('msg').textContent='ガチ楽（またはタスクCanly）でログインしてから開いてください'; return; }
  const {db, ref, onValue} = window._fb;
  onValue(ref(db,'dealbox/deals'), snap => {
    deals = snap.val() || {};
    $('msg').style.display='none';
    renderBoard();
    if(selId && !editing) renderPanel();
  }, err => { $('msg').style.display='flex'; $('msg').textContent='案件BOXを読み込めませんでした（アクセス権限がありません）'; });
  // 秘書（記憶待ち）の状況
  onValue(ref(db,'dealbox/queue'), snap => { queue = snap.val() || {}; renderQueue(); });
  // メール送信日（中村さんのGmailで動く Apps Script が1時間おきに更新）
  onValue(ref(db,'dealbox/mail'), snap => { mailData = snap.val() || {}; renderBoard(); if(selId && !editing) renderPanel(); });
  onValue(ref(db,'dealbox/mailStatus'), snap => { mailStatus = snap.val() || {}; if(selId && !editing) renderPanel(); });
  onValue(ref(db,'members'), snap => { memberOf = {}; Object.entries(snap.val()||{}).forEach(([k,v])=>memberOf[k.split(',').join('.')] = v); });
};

// ===== カンバン =====
function matches(d, q){
  if(!q) return true;
  const c = d.contact || {};
  return [d.client, c.name, c.company, d.memo, d.issues, d.plan].join(' ').toLowerCase().includes(q.toLowerCase());
}

const lastMeet = d => arr(d.meetings).map(m=>m && m.date || '').filter(Boolean).sort().pop() || '';
let sortAsc = true;   // 既定は昇順
function toggleDir(){ sortAsc = !sortAsc; $('sortdir').textContent = sortAsc ? '↑ 昇順' : '↓ 降順'; renderBoard(); }
function visibleItems(){
  const q = $('q').value.trim();
  const items = Object.entries(deals).map(([id,d])=>({id,...d}))
    .filter(d => (d.status||'商談中')===curStatus && matches(d,q));
  const key = {
    lastMeet: d => lastMeet(d) || null,
    stores:   d => (d.stores===null||d.stores===undefined||d.stores==='') ? null : Number(d.stores),
    monthly:  d => (d.monthly===null||d.monthly===undefined||d.monthly==='') ? null : Number(d.monthly),
    name:     d => String(d.client||''),
    updated:  d => d.updatedAt || null,
    mail:     d => (mailData[d.id] && mailData[d.id].lastSentAt) || null
  }[$('sort').value];
  // 値が無い案件は昇順・降順どちらでも最後に回す
  return items.sort((a,b)=>{
    const x = key(a), y = key(b);
    if(x===null && y===null) return 0; if(x===null) return 1; if(y===null) return -1;
    const c = typeof x==='number' ? x - y : String(x).localeCompare(String(y),'ja');
    return sortAsc ? c : -c;
  });

function otherMinutesHtml(meets){
  const all = minutesCache[selId];
  if(!all) return `<div style="margin-top:6px"><span class="add" style="font-size:11px;color:var(--accent);cursor:pointer" onclick="loadMinutes()">保存されている議事録をすべて確認する</span></div>`;
  const linked = new Set(meets.map(minuteKeyOf).filter(Boolean));
  const others = Object.entries(all).filter(([k])=>!linked.has(k)).sort((a,b)=>String(b[1].date||'').localeCompare(String(a[1].date||'')));
  if(!others.length) return '';
  return `<h3 style="margin-top:12px">その他の議事録（${others.length}件）</h3>` + others.map(([k,m])=>`<div class="meet">

    ${openMeet['o:'+k]?`<div class="minutes">${esc(m.text)}</div>`:''}
  </div>`).join('');

// 議事録の本文をクリップボードにコピー（未読込なら読み込んでから）
async function copyMinutes(key){
  if(!minutesCache[selId]) await loadMinutes();
  const m = (minutesCache[selId]||{})[key];
  if(!m || !m.text){ toast('この議事録は保存されていません'); return; }
  try{ await navigator.clipboard.writeText(m.text); }
  catch(e){ const t = document.createElement('textarea'); t.value = m.text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('議事録をコピーしました');
}
async function loadMinutes(){
  const id = selId, {db, ref, get} = window._fb;
  try{ minutesCache[id] = (await get(ref(db,'dealbox/minutes/'+id))).val() || {}; }
  catch(e){ minutesCache[id] = {}; toast('議事録を読み込めませんでした'); }
  if(selId===id) renderPanel();
}

// 議事録: meetings[].minutesFile のファイル名で dealbox/minutes/{id} から引く
function minuteKeyOf(m){
  const f = m.minutesFile || m.transcript_file; if(!f) return null;
  return f.split(/[\\/]/).pop().replace(/\.md$/,'').replace(/[.$#\[\]\/]/g,'_');
}
function minutesHtml(m){
  const all = minutesCache[selId];
  if(!all) return '読み込み中...';
  const key = minuteKeyOf(m);
  const hit = key && all[key];
  return hit ? esc(hit.text) : 'この商談の議事録は保存されていません';
}
async function toggleMeet(i){
  openMeet[i] = !openMeet[i];
  renderPanel();
  if(openMeet[i] && !minutesCache[selId]) await loadMinutes();
}

  const id = selId, list = visibleItems().map(d=>d.id), i = list.indexOf(id);

}

async function submitMinutes(){
  const text = $('n-text').value.trim();
  if(text.length < 20){ toast('議事録の本文を貼り付けてください'); return; }
  const qid = 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const {db, ref, set} = window._fb;
  await set(ref(db,'dealbox/queue/'+qid), {
    text, dealId: newDealId || $('n-deal').value || null, submittedBy: me, submittedAt: nowIso(), status: 'pending'
  });
  mineSeen[qid] = 'pending';
  closeNew(); toast('秘書に送りました。記憶が終わると反映されます');
}
function closeNew(){ $('modal').classList.remove('open'); $('modal').dataset.view=''; $('m-foot').style.display=''; }
async function saveManual(){
  const client = $('n-client').value.trim();
  if(!client){ toast('会社名を入力してください'); return; }
  const id = 'd' + Date.now().toString(36);
  const now = nowIso(), mdate = $('n-mdate').value, minutes = $('n-minutes').value.trim();
  const mkey = minutes ? (mdate||today()) + '-minutes' : null;
  const deal = {
    id, client, status: $('n-status').value, plan: $('n-plan').value.trim() || null,
    stores: num('n-stores'), monthly: num('n-monthly'), initialFee: num('n-initialFee'),
    contact: {name:$('n-cname').value.trim(), title:$('n-ctitle').value.trim(), email:$('n-cemail').value.trim(), phone:$('n-cphone').value.trim()},
    issues: $('n-issues').value, memo: $('n-memo').value,
    meetings: (minutes || $('n-mtype').value.trim()) ? [{date: mdate, type: $('n-mtype').value.trim(), summary: '', ...(mkey?{minutesFile: mkey+'.md'}:{})}] : [],
    nextActions: [], nextMeeting: null, createdAt: now, updatedAt: now
  };
  const {db, ref, set} = window._fb;
  await set(ref(db,'dealbox/deals/'+id), deal);
  if(mkey) await set(ref(db,`dealbox/minutes/${id}/${mkey}`), {file: mkey+'.md', date: mdate, text: minutes});
  closeNew(); toast('登録しました'); followDeal(id);
}

// ===== 秘書（記憶待ち）の状況表示 =====
const Q_LABEL = {pending:'記憶待ち', processing:'記憶中', done:'完了', error:'エラー'};
function renderQueue(){
  const items = Object.entries(queue);
  const waiting = items.filter(([,v])=>v.status==='pending'||v.status==='processing').length;
  const errors = items.filter(([,v])=>v.status==='error').length;
  const el = $('qpill');
  el.className = 'qpill' + (waiting||errors ? ' show' : '') + (errors && !waiting ? ' err' : '');
  el.innerHTML = waiting ? `<span class="spin"></span>秘書が記憶中 ${waiting}件` : errors ? `記憶エラー ${errors}件` : '';
  // 自分が送った議事録の記憶が終わったら知らせる
  for(const [qid,v] of items){
    if(mineSeen[qid] && mineSeen[qid]!==v.status){
      if(v.status==='done') toast('記憶が完了しました：' + ((deals[v.resultDealId]||{}).client || ''));
      if(v.status==='error') toast('記憶でエラーが発生しました');
      mineSeen[qid] = v.status;
    }
  }
  if($('modal').dataset.view==='queue') openQueue();
}
function openQueue(){
  const items = Object.entries(queue).sort((a,b)=>String(b[1].submittedAt).localeCompare(String(a[1].submittedAt))).slice(0,30);
  $('m-title').textContent = '秘書の記憶状況';
  $('m-foot').style.display = 'none';
  $('modal').dataset.view = 'queue';
  $('m-body').innerHTML = items.length ? items.map(([qid,v])=>`<div class="qrow">
      <span class="st" style="color:${v.status==='error'?'var(--red)':v.status==='done'?'var(--s3)':'var(--accent)'}">${Q_LABEL[v.status]||v.status}</span>
      <div class="bd">${esc((v.submittedAt||'').replace('T',' ').slice(0,16))}　${esc(v.submittedBy||'')}<br>
        ${v.resultDealId && deals[v.resultDealId] ? `→ <a href="#" onclick="closeNew();followDeal('${v.resultDealId}');return false">${esc(deals[v.resultDealId].client)}</a>` : ''}
        ${v.note ? '<br>'+esc(v.note) : ''}${v.error ? '<br><span class="er">'+esc(v.error)+'</span>' : ''}
        ${v.status==='error' ? `<br><a href="#" onclick="retryQueue('${qid}');return false">もう一度記憶させる</a>` : ''}</div>
    </div>`).join('') : '<div class="empty">まだ記憶の履歴はありません</div>';
  $('modal').classList.add('open');
}
async function retryQueue(qid){
  const {db, ref, update} = window._fb;
  await update(ref(db,'dealbox/queue/'+qid), {status:'pending', error:null});
  toast('もう一度秘書に送りました');
}
</script>
