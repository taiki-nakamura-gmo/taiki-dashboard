<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無限会社中村 バーチャルスタジオ</title>
<style>
:root{
  --bg:#F0EFE9;--surface:#FFF;--surface2:#EFEDE6;
  --border:#E2DFD6;--border2:#C9C6BC;
  --text:#18171A;--text2:#5C5A62;--text3:#9B99A4;
  --accent:#3A5EE5;--accent-bg:#EDF0FC;
  --green:#1A7A50;--green-bg:#E8F5EE;
  --amber:#A05C00;--amber-bg:#FEF4E3;
  --red:#C0253A;--red-bg:#FDEAED;
  --r8:8px;--r12:12px;--r16:16px;
  --shadow:0 1px 4px rgba(0,0,0,.07),0 0 1px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --font:"Instrument Sans",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:16px;margin:0}
header .sub{font-size:11px;color:var(--text3);margin-top:2px}
header a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
main{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.status{font-size:12px;color:var(--text3);margin-bottom:12px;text-align:center}
.floor-wrap{display:flex;justify-content:center}
.floor{
  position:relative;width:100%;max-width:820px;aspect-ratio:16/10;
  background:
    repeating-linear-gradient(0deg,#e4ded0 0 32px,#ddd6c6 32px 33px),
    repeating-linear-gradient(90deg,#e4ded0 0 32px,#ddd6c6 32px 33px);
  border:2px solid var(--border2);border-radius:var(--r16);overflow:hidden;box-shadow:var(--shadow-lg);
}
.furni{position:absolute;transform:translate(-50%,-50%);image-rendering:pixelated;pointer-events:none}
.npc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:left 3.2s cubic-bezier(.45,.05,.4,.95), top 3.2s cubic-bezier(.45,.05,.4,.95);}
.npc-bubble{
  font-size:11px;font-weight:600;line-height:1.4;color:var(--text);background:var(--surface);
  border:1px solid var(--border2);border-radius:10px;padding:5px 9px;max-width:160px;min-width:70px;
  text-align:center;box-shadow:var(--shadow);white-space:normal;
}
.npc-bubble.anxious{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.npc-bubble.happy{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.npc-sprite{width:56px;height:56px;image-rendering:pixelated}
.npc-name{
  font-size:10.5px;font-weight:700;background:rgba(255,255,255,.92);border:1px solid var(--border2);
  border-radius:999px;padding:1px 8px;white-space:nowrap;
}
.legend{display:flex;justify-content:center;gap:18px;margin-top:16px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2)}
.legend-item img{width:24px;height:24px;image-rendering:pixelated}
footer{text-align:center;color:var(--text3);font-size:10.5px;padding:24px 16px}
footer a{color:var(--text3)}
</style>
</head>
<body>

<header>
  <div>
    <h1>🏢 無限会社中村 バーチャルスタジオ</h1>
    <div class="sub">営業チーム(中村T)の様子</div>
  </div>
  <a href="./index.html">← 案件Canlyへ戻る</a>
</header>

<main>
  <div class="status" id="status">案件Canlyから読み込み中…</div>
  <div class="floor-wrap"><div class="floor" id="floor"></div></div>
  <div class="legend" id="legend"></div>
</main>

<footer>
  無限会社中村 © 2026 ／ ドット絵素材: <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney.nl</a> (CC0)
</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ANKEN_URL = 'https://taiki-tasks-933cc-default-rtdb.asia-southeast1.firebasedatabase.app/anken.json';

function today() {
  return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
}
function currentMonth() {
  return today().slice(0, 7);
}
const pct = (a, b) => (b > 0 ? Math.min(Math.round((a / b) * 100), 999) : 0);

// ---------- 日本の祝日・営業日(cockpitと同じロジック。土日・祝日を除く) ----------
const _holidayCache = {};
function japaneseHolidays(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const holidays = new Set();
  const add = (m, d) => holidays.add(`${year}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`);
  const nthMonday = (month, nth) => {
    const dow = new Date(year, month - 1, 1).getDay();
    return 1 + ((8 - dow) % 7) + (nth - 1) * 7;
  };
  add(1, 1);
  add(1, nthMonday(1, 2));
  add(2, 11);
  add(2, 23);
  const shunbun = Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  add(3, shunbun);
  add(4, 29);
  add(5, 3);
  add(5, 4);
  add(5, 5);
  add(7, nthMonday(7, 3));
  add(8, 11);
  const respectDay = nthMonday(9, 3);
  add(9, respectDay);
  const shubun = Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  add(9, shubun);
  add(10, nthMonday(10, 2));
  add(11, 3);
  add(11, 23);
  if (shubun - respectDay === 2) add(9, respectDay + 1);
  const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  for (const hStr of [...holidays].sort()) {
    const [hy, hm, hd] = hStr.split('-').map(Number);
    const d = new Date(hy, hm - 1, hd);
    if (d.getDay() === 0) {
      const next = new Date(hy, hm - 1, hd);
      do { next.setDate(next.getDate() + 1); } while (holidays.has(dateKey(next)));
      holidays.add(dateKey(next));
    }
  }
  _holidayCache[year] = holidays;
  return holidays;
}
function isBusinessDay(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dow = new Date(y, m - 1, d).getDay();
  if (dow === 0 || dow === 6) return false;
  return !japaneseHolidays(y).has(dateStr);
}
function businessDaysStats(monthStr, uptoDateStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const uptoDay = uptoDateStr && uptoDateStr.startsWith(monthStr) ? Number(uptoDateStr.slice(8, 10)) : 0;
  let total = 0, elapsed = 0;
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${monthStr}-${String(day).padStart(2, '0')}`;
    if (isBusinessDay(ds)) { total++; if (day <= uptoDay) elapsed++; }
  }
  return { elapsed, total };
}

// ---------- 営業チーム(中村T)の配置・スプライト ----------
const TEAM = [
  { user: 'nakamura', name: '中村さん', role: 'FS専任・チーム長', target: 500000, sprite: 'nakamura', home: { x: 25, y: 28 } },
  { user: 'naka', name: '中さん', role: 'IS/FS兼務', target: 350000, sprite: 'naka', home: { x: 75, y: 28 } },
  { user: 'sakurai', name: '櫻井さん', role: 'IS専任', target: 200000, sprite: 'sakurai', home: { x: 25, y: 76 } },
  { user: 'aoki', name: '青木さん', role: 'IS専任', target: 200000, sprite: 'aoki', home: { x: 75, y: 76 } },
];
const SPOTS = [
  { key: 'meeting', label: '🪑 ミーティング', flavor: '🪑 ちょっと相談中', x: 50, y: 20 },
  { key: 'coffee', label: '☕ コーヒー', flavor: '☕ 一息ついてます', x: 50, y: 84 },
];
const DESK_POS = TEAM.map((m) => m.home);

function personYomi(deals, user, probs) {
  return deals.reduce((s, d) => {
    if (!probs.includes(d.prob)) return s;
    const a = Number(d.amount) || 0;
    if (d.fs === user) s += a / 2;
    if (d.is === user) s += a / 2;
    return s;
  }, 0);
}

let timers = [];
function stopMovement() { timers.forEach(clearTimeout); timers = []; }

function furniHtml() {
  let html = '';
  DESK_POS.forEach((p) => { html += `<img class="furni" src="studio-assets/desk.png" style="left:${p.x}%; top:${p.y + 13}%; width:52px; height:52px;">`; });
  html += `<img class="furni" src="studio-assets/plant.png" style="left:6%; top:8%; width:44px; height:44px;">`;
  html += `<img class="furni" src="studio-assets/plant.png" style="left:94%; top:92%; width:44px; height:44px;">`;
  return html;
}
function npcHtml(m, i) {
  return `
    <div class="npc" id="npc${i}" style="left:${m.home.x}%; top:${m.home.y}%" data-home-x="${m.home.x}" data-home-y="${m.home.y}">
      <div class="npc-bubble" id="bubble${i}">読み込み中…</div>
      <img class="npc-sprite" id="sprite${i}" src="studio-assets/${m.sprite}_1.png">
      <div class="npc-name">${esc(m.name)}</div>
    </div>`;
}
function scheduleWander(i, m, moodBubble) {
  const delay = 5500 + Math.random() * 6000;
  const t = setTimeout(() => {
    const el = $('npc' + i);
    if (!el) return;
    const home = { x: Number(el.dataset.homeX), y: Number(el.dataset.homeY) };
    const goHome = Math.random() < 0.4;
    const dest = goHome ? home : SPOTS[Math.floor(Math.random() * SPOTS.length)];
    el.style.left = dest.x + '%';
    el.style.top = dest.y + '%';
    const bubbleEl = $('bubble' + i);
    if (bubbleEl) {
      if (goHome) {
        bubbleEl.textContent = moodBubble.text;
        bubbleEl.className = 'npc-bubble' + (moodBubble.mood === 'anxious' ? ' anxious' : moodBubble.mood === 'happy' ? ' happy' : '');
      } else {
        bubbleEl.textContent = dest.flavor;
        bubbleEl.className = 'npc-bubble';
      }
    }
    // 歩行中は少しの間フレームを切り替えて「歩いてる」感を出す
    const spriteEl = $('sprite' + i);
    if (spriteEl) {
      spriteEl.src = `studio-assets/${m.sprite}_2.png`;
      setTimeout(() => { if (spriteEl) spriteEl.src = `studio-assets/${m.sprite}_1.png`; }, 1400);
    }
    scheduleWander(i, m, moodBubble);
  }, delay);
  timers.push(t);
}

function moodBubbleFor(m, deals, elapsedRatio) {
  const val = personYomi(deals, m.user, ['70', 'confirmed']);
  const paceTarget = m.target * elapsedRatio;
  const p = pct(val, m.target);
  const mood = val < paceTarget * 0.8 ? 'anxious' : p >= 100 ? 'happy' : 'calm';
  const text = mood === 'anxious'
    ? `達成率${p}%…このままだとちょっとヤバいかも💦追い込みます`
    : mood === 'happy'
    ? `目標達成済みです！余裕っす✌️(達成率${p}%)`
    : `対理想ペースでまずまず。達成率${p}%です`;
  return { mood, text, p, val };
}

async function boot() {
  const floor = $('floor');
  floor.innerHTML = furniHtml() + TEAM.map(npcHtml).join('');
  $('legend').innerHTML = TEAM.map((m) => `<div class="legend-item"><img src="studio-assets/${m.sprite}_1.png">${esc(m.name)}・${esc(m.role)}</div>`).join('');

  let anken;
  try {
    const r = await fetch(ANKEN_URL);
    anken = await r.json();
  } catch (e) {
    $('status').textContent = '数字を取得できませんでした(ネットワークエラー)';
    return;
  }
  const month = currentMonth();
  const deals = Object.values(anken || {}).filter((d) => d && d.month === month);
  const { elapsed, total } = businessDaysStats(month, today());
  const elapsedRatio = total > 0 ? elapsed / total : 0;
  $('status').textContent = `📅 ${month.slice(0,4)}年${Number(month.slice(5))}月 ／ 営業日 ${elapsed}/${total} ／ 案件Canly連携`;

  stopMovement();
  TEAM.forEach((m, i) => {
    const mb = moodBubbleFor(m, deals, elapsedRatio);
    const bubbleEl = $('bubble' + i);
    bubbleEl.textContent = mb.text;
    bubbleEl.className = 'npc-bubble' + (mb.mood === 'anxious' ? ' anxious' : mb.mood === 'happy' ? ' happy' : '');
    scheduleWander(i, m, mb);
  });
}
boot();
</script>
</body>
</html>
