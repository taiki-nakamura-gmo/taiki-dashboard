<style>
  :root{
    --side-bg:linear-gradient(90deg,#005BAC 0%,#1371B1 25%,#2585B7 50%,#2A90BC 75%,#1A9ACC 100%); --side-text:#fff; --side-label:rgba(255,255,255,.72); --side-hover:rgba(255,255,255,.14); --side-line:rgba(255,255,255,.28);
    --brand:#0b3d91; --brand-dark:#0a2e6e; --brand-light:#6f93d3;
    --accent:#1a7fe0; --text:#333; --muted:#777; --line:#dcdcdc; --bg:#fff; --panel:#fafafa;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo","Yu Gothic UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);display:flex;overflow:hidden}
  a{color:inherit;text-decoration:none}

  /* ===== サイドバー ===== */
  #side{width:206px;flex-shrink:0;background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;transition:width .2s;position:relative}
  #side .logo{height:52px;background:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer}
  #side .logo svg{flex-shrink:0}
  #side .logo img{width:30px;height:30px;flex-shrink:0;border-radius:6px;object-fit:contain}
  #side .logo .t1{font-size:9px;color:#555;line-height:1;letter-spacing:.5px}
  #side .logo .t2{font-size:18px;letter-spacing:1px;font-weight:700;color:var(--brand-dark);line-height:1.2;white-space:nowrap}
  /* 左メニューの文字は太字 */
  #side .sec,#side .item,#side .sub{font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif}
  #side .sec{font-weight:700;font-size:10px;color:var(--side-label);padding:12px 8px 4px;white-space:nowrap}
  #side .item{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative}
  #side .item:hover{background:var(--side-hover)}
  #side .item.active{background:#fff;color:var(--text)}
  #side .item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  #side .item svg{width:15px;height:15px;flex-shrink:0;fill:currentColor}
  #side .item .ext{margin-left:auto;width:12px;height:12px;opacity:.8}
  #side .item .caret{margin-left:auto;font-size:9px;opacity:.8;transition:transform .15s}
  #side .item.expanded .caret{transform:rotate(180deg)}
  #side .subs{display:none}
  #side .subs.open{display:block}
  #side .sub{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 33px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative;color:rgba(255,255,255,.88)}
  #side .sub:hover{background:var(--side-hover);color:#fff}
  #side .sub.active{background:#fff;color:var(--text);font-weight:700}
  #side .sub.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  #side .sub .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  body.collapsed #side .sub{padding-left:20px}
  #side hr{border:0;border-top:1px solid var(--side-line);margin:4px 0}
  #side .support{position:absolute;left:8px;bottom:14px;background:#fff;color:#005BAC;border-radius:20px;height:32px;padding:0 22px 0 10px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
  #side .support .q{width:18px;height:18px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
  body.collapsed #side{width:48px}
  body.collapsed #side .t1,body.collapsed #side .t2,body.collapsed #side .sec,body.collapsed #side .label,body.collapsed #side .ext,body.collapsed #side .caret,body.collapsed #side .support span:last-child{display:none}
  body.collapsed #side .support{padding:0 7px}

  /* ===== メイン ===== */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #head .toggle{cursor:pointer;font-size:14px;color:#333;user-select:none;margin-right:4px}
  /* ===== お知らせ（ベル） ===== */
  #bell{margin-left:auto;position:relative;width:36px;height:36px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;color:#555}
  #bell.show{display:flex}
  #bell:hover{background:#f0f2f5}
  #bell svg{width:22px;height:22px;fill:currentColor}
  #bell .cnt{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#d93025;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  #bell .cnt:empty{display:none}
  /* お知らせパネル: フォントはタスクCanly・案件BOXと統一 */
  #notif{position:fixed;top:58px;right:14px;width:min(600px,calc(100vw - 28px));max-height:82vh;background:#fff;border:1px solid #E2DFD6;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.18);z-index:60;display:none;flex-direction:column;font-family:"Instrument Sans",sans-serif;color:#18171A}
  #notif.open{display:flex}
  #notif .n-head{padding:16px 20px;border-bottom:1px solid #E2DFD6;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px}
  #notif .n-head small{font-weight:400;color:#5C5A62;font-size:12.5px}
  #notif .n-body{overflow-y:auto}
  #notif .n-sec{padding:10px 20px 8px;font-size:13px;font-weight:700;color:#5C5A62;background:#F0EFE9;border-bottom:1px solid #E2DFD6}
  #notif .n-item{padding:14px 20px;border-bottom:1px solid #E2DFD6;font-size:14px}
  #notif .n-item .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #notif .n-item .kind{font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:2px 10px;white-space:nowrap}
  #notif .n-item .co{font-size:15px;font-weight:700;cursor:pointer;color:#18171A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #notif .n-item .co:hover{color:#3A5EE5;text-decoration:underline}
  /* 期限バッジ: 通常=グレー枠、期限切れ=赤枠、今日=赤で点滅 */
  #notif .n-item .due{margin-left:auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:4px 11px 4px 9px;border-radius:20px;background:#F0EFE9;border:1px solid #C9C6BC;color:#18171A;font-size:13px;font-weight:700}
  #notif .n-item .due svg{width:14px;height:14px;fill:currentColor;flex-shrink:0}
  #notif .n-item.over .due{background:#FDEAED;border-color:#E8A3AE;color:#C0253A}
  #notif .n-item.today .due{background:#C0253A;border-color:#C0253A;color:#fff;animation:duePulse 1.1s ease-in-out infinite}
  @keyframes duePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(192,37,58,.55)}50%{opacity:.6;box-shadow:0 0 0 6px rgba(192,37,58,0)}}
  #notif .n-item.done .due{background:#fff;border-color:#E2DFD6;color:#9B99A4;font-weight:600}
  #notif .n-item .dt{color:#18171A;line-height:1.65}
  #notif .n-item .acts{margin-top:10px;display:flex;gap:8px}
  #notif .n-item .acts button{border:1px solid #E2DFD6;background:#fff;border-radius:8px;font-size:13px;padding:6px 16px;cursor:pointer;font-family:inherit;color:#5C5A62}
  #notif .n-item .acts button.ok{background:#3A5EE5;border-color:#3A5EE5;color:#fff;font-weight:600}
  #notif .n-item .acts button:hover{filter:brightness(.97)}
  #notif .n-item .acts button.ok:hover{filter:brightness(1.1)}
  #notif .n-task{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px dashed #E2DFD6}
  #notif .n-task:first-of-type{border-top:0}
  #notif .n-task .kind{margin-top:2px}
  #notif .n-task .dt{flex:1;min-width:0}
  #notif .n-task .mini{display:flex;gap:4px;flex-shrink:0}
  #notif .n-task .mini button{border:1px solid #E2DFD6;background:#fff;border-radius:6px;font-size:11.5px;padding:3px 9px;cursor:pointer;font-family:inherit;color:#5C5A62;white-space:nowrap}
  #notif .n-task .mini button.ok{border-color:#3A5EE5;color:#3A5EE5;font-weight:600}
  #notif .n-item .ask{color:#C0253A;font-weight:700;font-size:13px;margin-bottom:4px}
  #notif .n-item.done{background:#FAFAF7;color:#9B99A4}
  #notif .n-item.done .co,#notif .n-item.done .dt{color:#9B99A4}
  #notif .n-item.done .kind{opacity:.5}
  #notif .n-empty{padding:40px 20px;text-align:center;color:#9B99A4;font-size:14px}
  #head{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
  #head h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  #head h1 svg{width:17px;height:17px;fill:var(--brand-dark)}
  #content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
  #listview{flex:1;overflow:auto;padding:14px}
  .tool{flex:1;display:none;flex-direction:column;min-height:0}
  .tool.show{display:flex}
  .tool iframe{flex:1;width:100%;border:0;display:block}
  .tool .note{font-size:11px;color:#6b5a00;background:#fff8e1;border-bottom:1px solid #f0e2a8;padding:6px 14px;display:flex;gap:12px;align-items:center}
  .tool .note a{color:var(--accent);text-decoration:underline;cursor:pointer}

  /* ===== 共通パーツ（キャプチャの「申請する」画面を踏襲） ===== */
  .split{display:flex;gap:14px;align-items:flex-start}
  .cat-col{width:122px;flex-shrink:0}
  .col-title{font-size:11px;font-weight:700;margin-bottom:6px}
  .cat-list{border:1px solid var(--line);max-height:150px;overflow-y:auto}
  .cat-list div{padding:7px 8px;font-size:10.5px;border-bottom:1px solid #eee;cursor:pointer}
  .cat-list div:last-child{border-bottom:0}
  .cat-list div:hover{background:#f2f7fd}
  .cat-list div.sel{background:var(--accent);color:#fff}
  .list-col{flex:1;min-width:0}
  .search{width:160px;height:30px;border:1px solid var(--line);border-radius:2px;padding:0 8px;font-size:12px;margin-bottom:14px;font-family:var(--font)}
  .search:focus{outline:none;border-color:var(--accent)}
  .cards{border:1px solid var(--line);border-radius:2px}
  .card{display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid #eee}
  .card:last-child{border-bottom:0}
  .card .ttl{font-size:11px;font-weight:700;margin-bottom:3px}
  .card .desc{font-size:10px;color:var(--muted)}
  .card .btn{margin-left:auto;flex-shrink:0;border:1px solid #888;border-radius:3px;background:#fff;font-size:10px;padding:2px 6px;cursor:pointer;font-family:var(--font)}
  .card .btn:hover{background:#f2f2f2}
  .card .tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;margin-left:6px;font-weight:400;vertical-align:1px}
  .tag.ok{background:#e6edf8;color:var(--brand-dark)}
  .tag.todo{background:#fff1d6;color:#a56a00}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:11px}

  .placeholder{border:1px dashed #c8c8c8;border-radius:4px;background:var(--panel);padding:18px;margin-top:16px;color:var(--muted);font-size:12px;line-height:1.8}
  .placeholder b{color:var(--text)}

  /* ログインゲート（未ログイン時は全面を覆う） */
  #gate{position:fixed;inset:0;z-index:100;background:#f0efe9;display:flex;flex-direction:column}
  #gate .g-head{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
  #gate .g-head img{width:30px;height:30px;border-radius:6px;object-fit:contain}
  #gate .g-head .t1{font-size:9px;color:#555;line-height:1;letter-spacing:.5px}
  #gate .g-head .t2{font-size:18px;font-weight:700;color:var(--brand-dark);line-height:1.2;letter-spacing:1px}
  #gate .g-msg{text-align:center;font-size:12px;color:var(--muted);padding:14px 0 0}
  #gate iframe{flex:1;border:0;width:100%}
  @media (max-width:700px){
    body.mob-auto #side{width:48px}
    body.mob-auto #side .t1,body.mob-auto #side .t2,body.mob-auto #side .sec,body.mob-auto #side .label,body.mob-auto #side .ext,body.mob-auto #side .caret,body.mob-auto #side .support span:last-child{display:none}
    .split{flex-direction:column}
    .cat-col{width:100%}
  }
</style>
</head>

<script>
// ===== ページ定義（各ページの中身はこれから決める。今は既存ツールの頭出しのみ） =====
const ICON = {
  home:'<svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>',
  task:'<svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>',

  dealbox:'<svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-.9-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z"/></svg>',

};

// 既存ツールとの突合候補（status: ok=既存あり / todo=未定）
const PAGES = {
  task:{ title:'タスクCanly', cats:['全て','タスク','見積','WF','ゴミ箱'], items:[
    {c:'タスク', t:'タスクカンバン', d:'4列カンバンでタスクを管理（taiki-dashboard から移植予定）', s:'ok'},
    {c:'見積',  t:'見積タスク', d:'プラン選択で定価を自動入力（PLAN_PRICES）', s:'ok'},
    {c:'WF',    t:'ワークフロー申請タスク', d:'WF提出状況の管理', s:'ok'},
    {c:'ゴミ箱', t:'ゴミ箱', d:'削除済みタスクの確認・復元', s:'ok'},
  ]},
  anken:{ title:'案件Canly', cats:['全て','ヨミ一覧','サマリー','失注'], items:[
    {c:'ヨミ一覧', t:'ヨミ一覧カンバン', d:'25% → 50% → 70% → 受注 の4列（金額降順）', s:'ok'},
    {c:'サマリー', t:'サマリー・達成率', d:'目標に対する達成率／回収済み自動合計', s:'ok'},
    {c:'失注',    t:'失注BOX', d:'失注案件の折りたたみ一覧', s:'ok'},
  ]},
  dealbox:{ title:'案件BOX', cats:['全て','一覧','登録'], items:[
    {c:'一覧', t:'案件一覧', d:'商談中／追客中／受注／失注ごとに、左に会社名リスト・右に詳細', s:'ok'},
    {c:'登録', t:'案件登録・記憶', d:'議事録を貼り付けると秘書が整理して記憶。約束した対応はベルでお知らせ', s:'ok'},
  ]},
  mitsumori:{ title:'見積もり書', cats:['全て','新規作成','テンプレート','作成履歴'], items:[  // 中身はユーザーと一緒に作る（右側は空）
  ]},
};
// 既存ツールの埋め込み先（A案：既存画面をそのままiframe表示）
PAGES.task.frame  = '../index.html?page=task&embed=1';
PAGES.anken.frame = '../index.html?page=anken&embed=1';
PAGES.dealbox.frame = '../dealbox.html?embed=1';
// ログイン判定（タスクCanlyと同じ基準: 最終利用から1日以内のセッションのみ有効）
function sessKey(){
  try{ const s = JSON.parse(localStorage.getItem('taiki_sess')||'null');
       return (s && s.key && Date.now()-s.ts < 24*60*60*1000) ? s.key : null; }catch(e){ return null; }
}
const ORDER = ['task','anken','dealbox','mitsumori'];
let state = {page:'home', cat:'全て', q:''};
let dealSub = '商談中';   // 案件BOXで表示中のステータス（URLは #dealbox/商談中）

function go(p){
  state = {page:p, cat:'全て', q:''};
  const h = p==='dealbox' ? 'dealbox/' + encodeURIComponent(dealSub) : p;
  if(location.hash.slice(1)!==h) location.hash = h; else render();
}
// 案件BOX: 押すとステータスのプルダウンが開く（開いていれば閉じる）
function toggleDealbox(){
  const subs = document.getElementById('dealbox-subs');
  if(subs.classList.contains('open') && state.page==='dealbox'){ setSubsOpen(false); return; }
  setSubsOpen(true); goSub(dealSub);
}
function setSubsOpen(open){
  document.getElementById('dealbox-subs').classList.toggle('open', open);
  document.getElementById('dealbox-item').classList.toggle('expanded', open);
}
function goSub(sub){ dealSub = sub; go('dealbox'); }
// 案件BOX側でステータスが変わった案件を追いかけるときに呼ばれる（URLと左メニューだけ合わせる）
// ===== お知らせ（商談で約束したことのリマインド） =====
// 秘書が議事録から読み取った「見積送付／資料送付／連絡予定」(dealbox/followups) を、期限の2日前からベルで知らせる。
// 期限を過ぎて「対応済み」になっていなければ「対応できていますか？」と赤字で出し続ける。完了は本人がボタンで付ける
const FU_KIND = { quote:{label:'見積送付', c:'#1a7fe0'}, docs:{label:'資料送付', c:'#7b4fd0'}, contact:{label:'連絡予定', c:'#d97706'}, call:{label:'連絡予定', c:'#d97706'} };
const NOTIFY_DAYS_BEFORE = 2;
const OWNER_DEFAULT = 'taiki-nakamura@gmotech.jp';   // 移行した案件は中村さんの案件として扱う
let bellUser = null, fuData = {}, fuDeals = {};
window.onBellAuth = user => {
  bellUser = user;
  document.getElementById('bell').classList.toggle('show', !!user);
  if(!user || window._bellSub) return;
  window._bellSub = true;
  const {db, ref, onValue} = window._pfb;
  onValue(ref(db,'dealbox/followups'), snap => { fuData = snap.val() || {}; renderNotif(); });
  onValue(ref(db,'dealbox/deals'), snap => { fuDeals = snap.val() || {}; renderNotif(); });
};
// 日付が変わったら表示を更新（期限の2日前になったものを出すため）
setInterval(() => { if(bellUser) renderNotif(); }, 30 * 60e3);
// 0時ちょうどにも描き直す（「今日対応したもの」を日付が変わった瞬間に消す）
(function atMidnight(){
  const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5);
  setTimeout(() => { if(bellUser) renderNotif(); atMidnight(); }, next - n);
})();
const todayStr = () => new Date().toLocaleDateString('sv-SE');
const md = d => d ? String(d).slice(5).replace('-','/').replace(/^0/,'') : '';
const daysUntil = d => Math.round((new Date(d) - new Date(todayStr())) / 864e5);
function myItems(){
  const me = (bellUser && bellUser.email || '').toLowerCase();
  const list = [], recent = [];
  for(const [id, items] of Object.entries(fuData)){
    const d = fuDeals[id]; if(!d) continue;
    if((d.createdBy || OWNER_DEFAULT).toLowerCase() !== me) continue;
    if(d.status !== '商談中') continue;   // お知らせは商談中フェーズの案件だけ
    for(const [key, f] of Object.entries(items || {})){
      if(!f || !FU_KIND[f.type]) continue;
      // 今日「対応済み／不要」にしたものは、元に戻せるよう下に残す
      if(f.status !== 'open'){
        if(f.doneAt && new Date(f.doneAt).toLocaleDateString('sv-SE') === todayStr()) recent.push({id, key, client:d.client, ...f});
        continue;
      }
      const left = f.due ? daysUntil(f.due) : 0;
      if(left > NOTIFY_DAYS_BEFORE) continue;   // まだ先のものは出さない
      list.push({id, key, client:d.client, left, ...f});
    }
  }
  list.recent = recent.sort((x,y)=> String(y.doneAt).localeCompare(String(x.doneAt)));
  return list.sort((x,y)=> x.left - y.left);
}
function renderNotif(){
  const list = myItems();
  // 期限が今日に近いものを上に: もうすぐ期限（今日→明日→あと2日）→ 期限切れ（1日経過→古いもの）
  const soon = list.filter(f => f.left >= 0).sort((x,y)=> x.left - y.left), over = list.filter(f => f.left < 0).sort((x,y)=> y.left - x.left);
  // 同じ会社で期限も同じ約束は1枚のカードにまとめる（期限が違えば別カード）
  const group = arr => { const m = new Map(); arr.forEach(f => { const k = f.id + '|' + (f.due || ''); if(!m.has(k)) m.set(k, []); m.get(k).push(f); }); return [...m.values()]; };
  const soonG = group(soon), overG = group(over), cards = soonG.length + overG.length;
  document.getElementById('bell-cnt').textContent = cards ? (cards > 99 ? '99+' : cards) : '';
  const when = f => f.left < 0 ? `期限 ${md(f.due)}（${-f.left}日経過）` : f.left === 0 ? '今日が期限' : f.left === 1 ? `明日 ${md(f.due)}` : `${md(f.due)}（あと${f.left}日）`;
  const ask = f => f.type==='quote' ? '見積は送れていますか？' : f.type==='docs' ? '資料は送れていますか？' : '連絡できていますか？';
  const CAL = '<svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg>';
  const note = f => f.meetingDate ? ' <span style="color:#5C5A62">（'+md(f.meetingDate)+'の商談で約束）</span>' : '';
  const card = g => {
    const f = g[0], multi = g.length > 1;
    const askTxt = f.left < 0 ? (multi && new Set(g.map(x=>x.type)).size > 1 ? '対応できていますか？' : ask(f)) : '';
    return `<div class="n-item ${f.left<0?'over':f.left===0?'today':''}">
      <div class="top">${multi ? '' : `<span class="kind" style="background:${FU_KIND[f.type].c}">${FU_KIND[f.type].label}</span>`}
        <span class="co" onclick="openDealFromBell('${f.id}')">${escH(f.client)}</span>
        <span class="due">${CAL}${when(f)}</span></div>
      ${multi
        ? (askTxt ? `<div class="ask">${askTxt}</div>` : '') + g.map(x => `<div class="n-task">
            <span class="kind" style="background:${FU_KIND[x.type].c}">${FU_KIND[x.type].label}</span>
            <div class="dt">${escH(x.detail)}${note(x)}</div>
            <div class="mini"><button class="ok" onclick="markFu('${x.id}','${x.key}','done')">対応済み</button><button onclick="markFu('${x.id}','${x.key}','dismissed')">不要</button></div>
          </div>`).join('')
          + `<div class="acts"><button class="ok" onclick="markFuMany('${f.id}','${g.map(x=>x.key).join(',')}','done')">まとめて対応済み</button></div>`
        : `<div class="dt">${askTxt ? '<b style="color:#C0253A">'+askTxt+'</b> ' : ''}${escH(f.detail)}${note(f)}</div>
           <div class="acts"><button class="ok" onclick="markFu('${f.id}','${f.key}','done')">対応済み</button><button onclick="markFu('${f.id}','${f.key}','dismissed')">不要</button></div>`}
    </div>`;
  };
  document.getElementById('n-body').innerHTML =
    (!list.length ? '<div class="n-empty">期限が近い約束はありません</div>' : '')
    + (soonG.length ? `<div class="n-sec">もうすぐ期限（${NOTIFY_DAYS_BEFORE}日以内・${soonG.length}件）</div>` + soonG.map(card).join('') : '')
    + (overG.length ? `<div class="n-sec" style="color:#C0253A">期限を過ぎています（${overG.length}件）</div>` + overG.map(card).join('') : '')
    + (list.recent.length ? `<div class="n-sec">今日対応したもの（${list.recent.length}件）</div>` + (() => {
        // 今日対応したものも会社ごとに1枚にまとめる
        const m = new Map(); list.recent.forEach(f => { if(!m.has(f.id)) m.set(f.id, []); m.get(f.id).push(f); });
        return [...m.values()].map(g => `<div class="n-item done">
          <div class="top"><span class="co" onclick="openDealFromBell('${g[0].id}')">${escH(g[0].client)}</span></div>
          ${g.map(f => `<div class="n-task">
            <span class="kind" style="background:${FU_KIND[f.type].c}">${FU_KIND[f.type].label}</span>
            <div class="dt">${escH(f.detail)} <span style="color:#9B99A4">（${f.status==='done' ? '✓ 対応済み' : '不要にしました'}）</span></div>
            <div class="mini"><button onclick="markFu('${f.id}','${f.key}','open')">元に戻す</button></div>
          </div>`).join('')}
        </div>`).join('');
      })() : '');
}
function escH(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleNotif(e){ e.stopPropagation(); document.getElementById('notif').classList.toggle('open'); }
document.addEventListener('click', e => { const n = document.getElementById('notif'); if(n.classList.contains('open') && !n.contains(e.target)) n.classList.remove('open'); });
async function markFuMany(id, keys, status){
  for(const k of String(keys).split(',')) await markFu(id, k, status);
}
async function markFu(id, key, status){
  const {db, ref, update} = window._pfb;
  const done = status !== 'open';
  await update(ref(db, `dealbox/followups/${id}/${key}`), {status, doneBy: done ? ((bellUser && bellUser.email) || '') : null, doneAt: done ? new Date().toISOString() : null});
}
// お知らせから案件BOXのその案件を開く
function openDealFromBell(id){
  document.getElementById('notif').classList.remove('open');
  const d = fuDeals[id]; if(!d) return;
  setSubsOpen(true); goSub(d.status || '商談中');
  let tries = 0;
  const t = setInterval(() => {
    try{ const w = document.querySelector('#tool-dealbox iframe').contentWindow;
         if(w.followDeal && w.deals && w.deals[id]){ w.followDeal(id); clearInterval(t); } }catch(e){}
    if(++tries > 40) clearInterval(t);
  }, 250);
}

window.syncDealSub = sub => {
  dealSub = sub;
  history.replaceState(null, '', '#dealbox/' + encodeURIComponent(sub));
  setSubsOpen(true); render();
};

function render(){
  const p = state.page;
  const subOpen = p==='dealbox' && document.getElementById('dealbox-subs').classList.contains('open');
  document.querySelectorAll('#side .item').forEach(el=>el.classList.toggle('active', el.dataset.page===p && !subOpen));
  document.querySelectorAll('#side .sub').forEach(el=>el.classList.toggle('active', p==='dealbox' && el.dataset.sub===dealSub));
  const title = p==='home' ? 'ホーム' : p==='dealbox' ? PAGES[p].title + '<span style="color:#999;font-weight:400;margin:0 6px">／</span>' + dealSub : PAGES[p].title;
  document.getElementById('ptitle').innerHTML = ICON[p] + title;
  const lv = document.getElementById('listview');
  const frame = p!=='home' && PAGES[p].frame;
  document.querySelectorAll('.tool').forEach(el=>el.classList.toggle('show', el.id==='tool-'+p));
  lv.style.display = frame ? 'none' : '';
  if(frame){
    showFrame(p);
    if(p==='dealbox'){ try{ document.querySelector('#tool-dealbox iframe').contentWindow.setStatus(dealSub); }catch(e){} }
    return;
  }
  lv.innerHTML = p==='home' ? homeView() : pageView(p);
  const s = document.getElementById('q');
  if(s){ s.value = state.q; s.oninput = e=>{ state.q = e.target.value; renderList(); }; }
}

// ホーム：キャプチャの「申請する」画面と同じ構成（左=分類、右=一覧）
function homeView(){
  const cats = ['全て'].concat(ORDER.map(k=>PAGES[k].title));
  return `<div class="split">
    <div class="cat-col"><div class="col-title">メニュー分類</div>
      <div class="cat-list">${cats.map(c=>`<div class="${c===state.cat?'sel':''}" onclick="pickCat('${c}')">${c}</div>`).join('')}</div>
    </div>
    <div class="list-col"><div class="col-title">機能検索</div>
      <input id="q" class="search">
      <div class="cards" id="list"></div>
    </div></div>`;
}
function pageView(p){
  const d = PAGES[p];
  return `<div class="split">
    <div class="cat-col"><div class="col-title">分類</div>
      <div class="cat-list">${d.cats.map(c=>`<div class="${c===state.cat?'sel':''}" onclick="pickCat('${c}')">${c}</div>`).join('')}</div>
    </div>
    <div class="list-col"></div></div>`;
}
function pickCat(c){ state.cat = c; render(); }

// iframeは一度作ったら使い回す（メニュー切替のたびに再読み込みしない）
function showFrame(p){
  let el = document.getElementById('tool-'+p);
  if(!el){
    el = document.createElement('div');
    el.className = 'tool show'; el.id = 'tool-'+p;
    el.innerHTML = (PAGES[p].note ? `<div class="note">${PAGES[p].note}</div>` : '')
      + `<iframe src="${bust(PAGES[p].frame + (p==='dealbox' ? '&status=' + encodeURIComponent(dealSub) : ''))}" title="${PAGES[p].title}" allow="clipboard-write"></iframe>`;
    document.getElementById('content').appendChild(el);
  }
}
function reloadFrame(p){
  const f = document.querySelector('#tool-'+p+' iframe');
  if(f) f.src = bust(PAGES[p].frame);
}
// GitHub Pagesは10分キャッシュされ、ポータルを再読み込みしても埋め込み側が古いまま残るため毎回付与
function bust(url){ return url + (url.includes('?')?'&':'?') + 't=' + Date.now(); }

function rows(){
  const p = state.page;
  let list = p==='home'
    ? ORDER.flatMap(k=>PAGES[k].items.map(i=>({...i, c:PAGES[k].title, page:k})))
    : PAGES[p].items.map(i=>({...i, page:p}));
  if(state.cat!=='全て') list = list.filter(i=>i.c===state.cat);
  if(state.q) list = list.filter(i=>(i.t+i.d).includes(state.q));
  return list;
}
function renderList(){
  const el = document.getElementById('list'); if(!el) return;
  const list = rows();
  el.innerHTML = list.length ? list.map(i=>`<div class="card">
      <div><div class="ttl">${i.t}<span class="tag ${i.s}">${i.s==='ok'?'既存ツールあり':'未定'}</span></div><div class="desc">${i.d}</div></div>
      <button class="btn" onclick="go('${i.page}')">開く</button></div>`).join('')
    : '<div class="empty">該当する機能がありません</div>';
}
const _render = render; render = function(){ _render(); renderList(); };

function toggleSide(){
  document.body.classList.remove('mob-auto');
  document.body.classList.toggle('collapsed');
  document.querySelector('#head .toggle').textContent = document.body.classList.contains('collapsed') ? '»' : '«';
}

function fromHash(){
  const parts = location.hash.slice(1).split('/'), h = parts[0], p = PAGES[h] ? h : 'home';
  if(p==='dealbox'){ if(parts[1]) dealSub = decodeURIComponent(parts[1]); setSubsOpen(true); }
  if(p!==state.page){ state = {page:p, cat:'全て', q:''}; }
  render();
}
window.addEventListener('hashchange', ()=>{ if(started) fromHash(); });
// ===== ログイン必須 =====
// ログインはタスクCanlyと共通（同じブラウザ保存のセッションを使う）。未ログイン時はガチ楽全体を隠してログイン画面を出す
function showGate(){
  if(document.getElementById('gate')) return;
  const g = document.createElement('div'); g.id = 'gate';
  g.innerHTML = '<div class="g-head">' + document.querySelector('#side .logo').innerHTML + '</div>'
    + '<div class="g-msg">ガチ楽を使うにはログインしてください（タスクCanly／案件Canlyと共通のアカウントです）</div>'
    + '<iframe src="' + bust('../index.html?embed=1') + '" title="ログイン"></iframe>';
  document.body.appendChild(g);
}
let started = false;
function checkLogin(){
  if(sessKey()){
    const g = document.getElementById('gate'); if(g) g.remove();
    if(!started){ started = true; state.page = null; fromHash(); }
  }else if(started){
    location.reload();   // ログアウトされたら埋め込み画面ごとリセットしてログイン画面へ
  }else{
    showGate();
  }
}
window.addEventListener('storage', e=>{ if(e.key==='taiki_sess' || e.key===null) checkLogin(); });
setInterval(checkLogin, 1500);   // ゲート内iframeでのログインはstorageイベントが届かない場合があるため補助
checkLogin();
</script>
